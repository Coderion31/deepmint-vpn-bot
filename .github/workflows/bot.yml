name: deepmint-vpn-bot

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: bot-cache
        with:
          path: users.json
          key: deepmint-bot-state-v1
          restore-keys: |
            deepmint-bot-state-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (one-shot poll)
        env:
          DEEPMINT_BOT_TOKEN: ${{ secrets.DEEPMINT_BOT_TOKEN }}
          BOT_POLL_ONESHOT: "1"
        run: python bot.py